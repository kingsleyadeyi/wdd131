<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131</title>

    <meta name="description" content="WDD 131 Product Review Form Assignment">
    <meta name="author" content="Kingsley Adeyi">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/form.css">
</head>

<body>

<header>

    <h1>⭐ Product Review</h1>

</header>

<main>

<form method="get" action="review.html">

    <!-- Product Name -->

    <fieldset>

        <legend>Product Information</legend>

        <label for="product">
            Product Name *
        </label>

        <select
            id="product"
            name="product"
            required>

            <option value="" disabled selected>
                Select a Product ...
            </option>

        </select>

    </fieldset>

    <!-- Rating -->

    <fieldset>

        <legend>Overall Rating *</legend>

        <div class="rating">

            <label>
                <input type="radio" name="rating" id="star1" value="1" required>
                ☆
            </label>

            <label>
                <input type="radio" name="rating" id="star2" value="2">
                ☆☆
            </label>

            <label>
                <input type="radio" name="rating" id="star3" value="3">
                ☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" id="star4" value="4">
                ☆☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" id="star5" value="5">
                ☆☆☆☆☆
            </label>

        </div>

    </fieldset>

    <!-- Installation -->

    <fieldset>

        <legend>Date of Installation *</legend>

        <label for="installDate">
            Installation Date
        </label>

        <input
            type="date"
            id="installDate"
            name="installDate"
            required>

    </fieldset>

    <!-- Features -->

    <fieldset>

        <legend>Useful Features</legend>

        <p>(Check all that apply)</p>

        <label>
            <input type="checkbox" id="durability" name="features" value="Durability">
            Durability
        </label>

        <label>
            <input type="checkbox" id="ease" name="features" value="Ease of Use">
            Ease of Use
        </label>

        <label>
            <input type="checkbox" id="performance" name="features" value="Performance">
            Performance
        </label>

        <label>
            <input type="checkbox" id="design" name="features" value="Design">
            Design
        </label>

    </fieldset>

    <!-- Written Review -->

    <fieldset>

        <legend>Written Review</legend>

        <label for="review">

            Tell us about your experience

        </label>

        <textarea
            id="review"
            name="review"
            rows="6"></textarea>

    </fieldset>

    <!-- Name -->

    <fieldset>

        <legend>Your Name</legend>

        <label for="username">

            Name

        </label>

        <input
            type="text"
            id="username"
            name="username">

    </fieldset>

    <input
        type="submit"
        value="Submit Review"
        class="submit">

</form>

</main>

<footer>

    <p>

        &copy; <span id="year"></span> | Kingsley Adeyi | WDD 131

    </p>

    <p>

        Last Modified:
        <span id="lastModified"></span>

    </p>

</footer>

<script src="scripts/form.js"></script>

</body>

</html>
